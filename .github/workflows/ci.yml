name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelé par release.yml : aucune version ne se publie sans avoir passé
  # exactement les mêmes vérifications qu'une PR.
  workflow_call:
    inputs:
      runner:
        type: string
        default: CI_RUNNER
  # À la main (onglet Actions › CI › Run workflow, sur la branche d'une PR) :
  # le résultat s'attache au commit, donc à la PR. Sert surtout quand la
  # machine du runner auto-hébergé est éteinte : « ubuntu-latest » fait
  # tourner la même CI sur les runners de GitHub.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner : celui de la variable CI_RUNNER, ceux de GitHub, ou l'auto-hébergé"
        type: choice
        options: [CI_RUNNER, ubuntu-latest, self-hosted]
        default: CI_RUNNER

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule, pour tous les jobs. Sans cette ligne, le jeton du workflow
# reçoit les droits par défaut du dépôt, écriture comprise selon son réglage,
# et chaque action tierce le voit — Semgrep en conteneur root, sur un runner
# à nous. Aucun job d'ici n'écrit sur GitHub : les artefacts passent par un
# autre jeton. Un job qui aurait besoin de plus le déclarerait lui-même, avec
# sa raison, comme ceux de release.yml et captures.yml.
permissions:
  contents: read

# Les jobs prennent n'importe quel runner auto-hébergé, Windows ou Linux,
# pourvu qu'il ait Docker (docs/runner-auto-heberge.md). La variable de dépôt
# CI_RUNNER, en JSON, choisit une autre cible sans toucher aux workflows :
# '"ubuntu-latest"' pour les runners de GitHub. Une exécution lancée à la main
# choisit la sienne (entrée `runner`), qui l'emporte sur la variable.
#
# Chaque job lance ses commandes dans un conteneur Linux (infra/ci/linux.sh),
# sur Windows comme sur Ubuntu : GitHub Actions ne lance ni `services:` ni
# action conteneur sur un runner Windows, le projet suppose Linux partout, et
# le même conteneur partout donne le même verdict. Le runner ne fait que
# piloter Docker depuis bash (Git Bash sous Windows, qui ne doit pas trouver
# le bash de WSL).

defaults:
  run:
    shell: bash

env:
  CI: "true"
  # Turbo télémétrie désactivée : rien ne sort de la CI sans raison.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, types, tests et build
    # Jamais le code d'une PR venue d'un fork sur nos machines : voir
    # docs/runner-auto-heberge.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner && inputs.runner != 'CI_RUNNER' && toJSON(inputs.runner) || vars.CI_RUNNER || '"self-hosted"') }}
    # Plus large qu'avant : l'installation et les tests passent par Docker.
    timeout-minutes: 30

    steps:
      # Sans cela, Git pour Windows extrait en CRLF, et le lint, les scripts
      # bash et l'empreinte d'openapi.json voient d'autres fichiers que le
      # dépôt (.gitattributes l'impose aussi).
      # Le service du runner ne voit pas toujours le PATH de la session : on
      # pose ici, devant tout le reste (y compris le bash de WSL), le bash de
      # Git for Windows et docker.exe, qu'exigent toutes les étapes suivantes.
      # La stratégie d'exécution de Windows refuse les scripts par défaut :
      # levée pour ce seul processus.
      - name: Bash de Git et Docker
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $git = @("$env:ProgramFiles\Git\bin", "${env:ProgramFiles(x86)}\Git\bin", "$env:LOCALAPPDATA\Programs\Git\bin") |
            Where-Object { Test-Path "$_\bash.exe" } | Select-Object -First 1
          if (-not $git) { Write-Output "::error::Git for Windows introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $git
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $docker = "$env:ProgramFiles\Docker\Docker\resources\bin"
            if (-not (Test-Path "$docker\docker.exe")) { Write-Output "::error::docker.exe introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $docker
          }

      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      # Sans jeton dans .git/config : le dépôt est copié tel quel dans le
      # conteneur, où tournent l'installation et les tests (code des
      # dépendances compris). Aucune étape n'en a besoin : rien n'y parle à
      # GitHub (même règle que release.yml, captures.yml et codeql.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Avec une base : sans `DATABASE_URL`, les tests d'intégration
      # (`*.integration.test.ts`, plus de 300) se sautaient ici et ne
      # tournaient qu'en local. Chacun crée sa base jetable sur ce serveur
      # (apps/api/src/test/throwaway-database.ts), d'où le rôle
      # superutilisateur de l'image.
      - name: Conteneur Linux et base
        run: bash infra/ci/linux.sh ouvrir --postgres

      # --frozen-lockfile : la CI échoue si le lockfile ne correspond pas au
      # package.json, plutôt que de résoudre silencieusement d'autres versions.
      - name: Installer les dépendances
        run: bash infra/ci/linux.sh lancer 'pnpm install --frozen-lockfile'

      - name: Lint
        run: bash infra/ci/linux.sh lancer 'pnpm lint'

      - name: Typecheck
        run: bash infra/ci/linux.sh lancer 'pnpm typecheck'

      # Refuse de passer au vert sans base : un `DATABASE_URL` perdu ferait
      # sauter les tests d'intégration sans que personne le voie.
      - name: Tests
        run: |
          bash infra/ci/linux.sh lancer '
            [ -n "${DATABASE_URL:-}" ] || { echo "::error::DATABASE_URL absente : les tests d intégration seraient sautés."; exit 1; }
            pnpm test'

      # Le build a besoin des variables d'environnement, mais aucun secret
      # n'est requis pour compiler : les clés ne sont lues qu'à l'exécution.
      - name: Build
        run: bash infra/ci/linux.sh lancer 'pnpm build'

      # Storybook est la référence visuelle de l'équipe : une histoire qui ne
      # compile plus doit se voir ici, pas le jour où quelqu'un veut consulter
      # un composant.
      - name: Build Storybook
        run: bash infra/ci/linux.sh lancer 'pnpm --filter @gamedashboard/ui build-storybook'

      # Le schéma Drizzle et les migrations doivent rester en phase. Sans cette
      # vérification, une colonne ajoutée au schéma sans migration ne se verrait
      # qu'au déploiement, face à une base qui ne la possède pas.
      # `db:check` et non `db:generate` seul : sans terminal, drizzle-kit
      # sort en succès même quand il s'arrête sur une question (voir
      # packages/db/scripts/check-migrations.mjs).
      - name: Migrations à jour
        run: |
          bash infra/ci/linux.sh lancer 'pnpm db:check' \
            || { echo "::error::Schéma et migrations désaccordés. Lancez pnpm db:generate et relisez la migration produite."; exit 1; }

      # Même raison, pour l'autre contrat : une route ajoutée au catalogue sans
      # régénérer la spécification donnerait un `openapi.json` qui décrit une
      # API d'hier. Ceux qui en génèrent leur client ne le verraient jamais —
      # ils obtiendraient simplement un client sans la nouvelle route.
      - name: Spécification OpenAPI à jour
        run: |
          bash infra/ci/linux.sh lancer 'pnpm openapi && git diff --exit-code openapi.json' \
            || { echo "::error::Catalogue de routes modifié sans régénérer la spécification. Lancez pnpm openapi."; exit 1; }

      - name: Rendre la machine du runner
        if: always()
        run: bash infra/ci/linux.sh fermer

  audit:
    name: Audit de sécurité des dépendances
    # Jamais le code d'une PR venue d'un fork sur nos machines : voir
    # docs/runner-auto-heberge.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner && inputs.runner != 'CI_RUNNER' && toJSON(inputs.runner) || vars.CI_RUNNER || '"self-hosted"') }}
    timeout-minutes: 20

    steps:
      # Le service du runner ne voit pas toujours le PATH de la session : on
      # pose ici, devant tout le reste (y compris le bash de WSL), le bash de
      # Git for Windows et docker.exe, qu'exigent toutes les étapes suivantes.
      # La stratégie d'exécution de Windows refuse les scripts par défaut :
      # levée pour ce seul processus.
      - name: Bash de Git et Docker
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $git = @("$env:ProgramFiles\Git\bin", "${env:ProgramFiles(x86)}\Git\bin", "$env:LOCALAPPDATA\Programs\Git\bin") |
            Where-Object { Test-Path "$_\bash.exe" } | Select-Object -First 1
          if (-not $git) { Write-Output "::error::Git for Windows introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $git
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $docker = "$env:ProgramFiles\Docker\Docker\resources\bin"
            if (-not (Test-Path "$docker\docker.exe")) { Write-Output "::error::docker.exe introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $docker
          }

      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      # Sans jeton dans .git/config : le dépôt est copié tel quel dans le
      # conteneur, où tournent l'installation et les tests (code des
      # dépendances compris). Aucune étape n'en a besoin : rien n'y parle à
      # GitHub (même règle que release.yml, captures.yml et codeql.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Conteneur Linux
        run: bash infra/ci/linux.sh ouvrir

      - name: Installer les dépendances
        run: bash infra/ci/linux.sh lancer 'pnpm install --frozen-lockfile'

      # Bloquant dès le niveau « low » : le projet part propre, autant le
      # garder ainsi plutôt que d'accumuler une dette qu'on cessera de lire.
      - name: pnpm audit
        run: bash infra/ci/linux.sh lancer 'pnpm audit --audit-level low'

      # Informe sans bloquer : une nouvelle version sortie le matin même ne
      # doit pas empêcher de livrer, mais elle doit se voir.
      - name: Versions en retard
        continue-on-error: true
        run: bash infra/ci/linux.sh lancer 'pnpm outdated -r'

      # Trivy lit le système de fichiers : dépendances **et** fichiers de
      # configuration. `pnpm audit` ne connaît que le registre npm — il ne voit
      # ni un Dockerfile qui tourne en root, ni un secret laissé dans un
      # fichier d'exemple, ni une image de base périmée.
      # Image épinglée par empreinte (voir IMAGE_TRIVY dans infra/ci/outils.env) :
      # en mars 2026, les tags de trivy-action ont été réécrits vers un voleur
      # de secrets. L'action elle-même ne tourne pas sous Windows.
      - name: Trivy — dépendances et configuration
        run: |
          source infra/ci/outils.env
          bash infra/ci/linux.sh outil "$IMAGE_TRIVY" fs \
            --scanners vuln,secret,misconfig --severity CRITICAL,HIGH \
            --exit-code 1 --ignore-unfixed \
            --skip-dirs node_modules --skip-dirs .next --skip-dirs .turbo /w

      # Semgrep cherche des motifs dans **notre** code, là où les deux autres
      # regardent ce qu'on importe. C'est le seul des trois qui puisse voir une
      # requête concaténée ou une comparaison de secret non constante.
      # Deux règles écartées, par décision de Matheo (2026-09-25) : elles
      # exigent d'attendre sept jours avant d'installer une version publiée,
      # contre la règle du projet « toujours les dernières versions stables ».
      # La chaîne d'approvisionnement reste couverte par pnpm audit, Trivy,
      # allowBuilds, blockExoticSubdeps et trustPolicy (pnpm-workspace.yaml).
      - name: Semgrep
        run: |
          source infra/ci/outils.env
          bash infra/ci/linux.sh outil "$IMAGE_SEMGREP" semgrep scan --error --metrics off \
            --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten \
            --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
            --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age \
            --exclude node_modules /w

      - name: Rendre la machine du runner
        if: always()
        run: bash infra/ci/linux.sh fermer

  e2e:
    name: Parcours critiques et accessibilité
    # Jamais le code d'une PR venue d'un fork sur nos machines : voir
    # docs/runner-auto-heberge.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner && inputs.runner != 'CI_RUNNER' && toJSON(inputs.runner) || vars.CI_RUNNER || '"self-hosted"') }}
    # Cinq minutes de plus pour le scan ZAP, dont le premier passage télécharge
    # l'image (1,5 Go) sur la machine du runner.
    timeout-minutes: 30

    # Une vraie base : l'interface est éprouvée contre l'API réelle, qui parle
    # à PostgreSQL. Une API simulée validerait le panel contre une fiction.
    # Elle tourne dans un conteneur à côté de celui du job, sur un réseau
    # propre au job (infra/ci/linux.sh ouvrir --postgres).

    env:
      # Clé d'essai, valable pour cette exécution seule. Elle ne déchiffre rien
      # d'autre que ce que la même exécution vient d'écrire.
      APP_SECRET_KEY: cle-de-test-ci-0123456789abcdef0123456789abcdef
      E2E_EMAIL: e2e@gamedashboard.test
      E2E_PASSWORD: Essai-E2E-2026!motdepasse

    steps:
      # Le service du runner ne voit pas toujours le PATH de la session : on
      # pose ici, devant tout le reste (y compris le bash de WSL), le bash de
      # Git for Windows et docker.exe, qu'exigent toutes les étapes suivantes.
      # La stratégie d'exécution de Windows refuse les scripts par défaut :
      # levée pour ce seul processus.
      - name: Bash de Git et Docker
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $git = @("$env:ProgramFiles\Git\bin", "${env:ProgramFiles(x86)}\Git\bin", "$env:LOCALAPPDATA\Programs\Git\bin") |
            Where-Object { Test-Path "$_\bash.exe" } | Select-Object -First 1
          if (-not $git) { Write-Output "::error::Git for Windows introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $git
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $docker = "$env:ProgramFiles\Docker\Docker\resources\bin"
            if (-not (Test-Path "$docker\docker.exe")) { Write-Output "::error::docker.exe introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $docker
          }

      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      # Sans jeton dans .git/config : le dépôt est copié tel quel dans le
      # conteneur, où tournent l'installation et les tests (code des
      # dépendances compris). Aucune étape n'en a besoin : rien n'y parle à
      # GitHub (même règle que release.yml, captures.yml et codeql.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Conteneur Linux et base
        run: bash infra/ci/linux.sh ouvrir --postgres

      - name: Installer les dépendances
        run: bash infra/ci/linux.sh lancer 'pnpm install --frozen-lockfile'

      # Le conteneur tourne en root : Playwright y pose lui-même les
      # bibliothèques système de Chromium.
      - name: Installer le navigateur
        run: bash infra/ci/linux.sh lancer 'pnpm --filter @gamedashboard/web exec playwright install --with-deps chromium'

      - name: Migrations
        run: bash infra/ci/linux.sh lancer 'pnpm --filter @gamedashboard/db db:migrate'

      # Le compte d'essai est créé par le **vrai** chemin de création : c'est
      # le code de l'application qui hache le mot de passe, et non un condensat
      # fabriqué à côté qui pourrait diverger de ce que la connexion attend.
      - name: Compte d'essai
        run: |
          bash infra/ci/linux.sh lancer '
            pnpm --filter @gamedashboard/api exec tsx scripts/create-admin.mts "$E2E_EMAIL" Essai CI
            GD_PASSWORD="$E2E_PASSWORD" \
              pnpm --filter @gamedashboard/api exec tsx scripts/reset-password.mts "$E2E_EMAIL"'

      # La seconde preuve du personnel est exigée par défaut (rapport ASVS,
      # NC-10), et le compte d'essai est administrateur : la suite, qui visite
      # l'administration (captures, accessibilité, Lighthouse), tomberait sur
      # « seconde preuve exigée ». Levée pour cette base jetable seule, plutôt
      # qu'un TOTP enrôlé dans la fixture : l'anti-rejeu refuse le même code
      # deux fois dans une fenêtre de trente secondes, et la suite se connecte
      # à chaque test. Le produit garde son défaut ; `staff-2fa.guard.test.ts`
      # et `platform-settings.test.ts` le tiennent.
      - name: Seconde preuve du personnel levée pour la base d'essai
        run: |
          bash infra/ci/linux.sh psql \
            "insert into settings (key, value) values ('security.staffRequires2fa', 'false'::jsonb)
             on conflict (key) do update set value = excluded.value"

      - name: Construire
        run: bash infra/ci/linux.sh lancer 'pnpm build'

      - name: Parcours et accessibilité
        run: bash infra/ci/linux.sh lancer 'pnpm e2e'

      # Scan passif de l'application compilée : en-têtes, CSP, cookies,
      # formulaires (PLAN §5.4). Une alerte nouvelle fait échouer le job ; les
      # exceptions acceptées sont dans infra/ci/zap-regles.tsv, chacune avec sa
      # raison. Le panel démarre dans le conteneur du job, et ZAP partage son
      # réseau.
      - name: Scan ZAP
        run: ZAP_CONTENEUR="$(bash infra/ci/linux.sh nom)" bash infra/ci/zap-baseline.sh zap-rapport

      - name: Rapatrier les rapports
        if: failure()
        continue-on-error: true
        run: bash infra/ci/linux.sh rapatrier apps/web/playwright-report

      - name: Rapport ZAP
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-rapport
          path: zap-rapport
          retention-days: 7

      # Seulement en cas d'échec : c'est précisément quand la suite est rouge
      # qu'on a besoin des traces et des captures ; une suite verte n'a rien à
      # montrer. Non bloquant : un quota de stockage d'artefacts atteint ne
      # doit pas rendre rouge une suite qui a passé.
      - name: Rapport
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Rendre la machine du runner
        if: always()
        run: bash infra/ci/linux.sh fermer

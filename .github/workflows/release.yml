name: Release

# Publie une version dans GitHub Releases : une archive du panel **déjà
# compilé**, que l'on installe avec trois commandes.
#
#   pnpm app:install  les dépendances, aux versions exactes du lockfile
#   pnpm app:setup    domaine, base, certificat, services, premier compte
#   pnpm app:start    démarre le panel sous systemd
#
# Se déclenche en poussant une étiquette :
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Une étiquette avec un suffixe (v1.2.0-rc.1) publie une préversion, que
# la page Releases ne présente pas comme « la dernière ».

on:
  push:
    tags: ["v*"]
  # Republier une étiquette existante, après une panne de la CI par exemple.
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette existante à publier (ex. v1.2.0)"
        required: true
      runner:
        description: "Runner : celui de la variable CI_RUNNER, ceux de GitHub, ou l'auto-hébergé"
        type: choice
        options: [CI_RUNNER, ubuntu-latest, self-hosted]
        default: CI_RUNNER

# Une seule publication à la fois par version ; jamais annulée en cours de
# route, pour ne pas laisser une release à moitié téléversée.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# Comme la CI : bash sur le runner (Git Bash sous Windows), commandes dans un
# conteneur Linux (infra/ci/linux.sh). Ici c'est indispensable et non commode :
# l'archive autonome embarque le binaire d'argon2 et l'interface standalone
# pour Linux x64, ceux des hébergements.
defaults:
  run:
    shell: bash

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verifier:
    name: Vérifications
    uses: ./.github/workflows/ci.yml
    # Les vérifications tournent là où la publication tournera.
    with:
      runner: ${{ inputs.runner || 'CI_RUNNER' }}

  publier:
    name: Compiler, assembler, publier
    needs: verifier
    # Même runner que la CI (docs/runner-auto-heberge.md).
    runs-on: ${{ fromJSON(inputs.runner && inputs.runner != 'CI_RUNNER' && toJSON(inputs.runner) || vars.CI_RUNNER || '"self-hosted"') }}
    timeout-minutes: 20
    permissions:
      # Créer la release et y téléverser l'archive.
      contents: write
      # Attestation de provenance : prouve que l'archive sort de ce workflow,
      # sur ce commit, et non d'un poste quelconque.
      id-token: write
      attestations: write

    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      # Le service du runner ne voit pas toujours le PATH de la session : on
      # pose ici, devant tout le reste (y compris le bash de WSL), le bash de
      # Git for Windows et docker.exe, qu'exigent toutes les étapes suivantes.
      # La stratégie d'exécution de Windows refuse les scripts par défaut :
      # levée pour ce seul processus.
      - name: Bash de Git et Docker
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $git = @("$env:ProgramFiles\Git\bin", "${env:ProgramFiles(x86)}\Git\bin", "$env:LOCALAPPDATA\Programs\Git\bin") |
            Where-Object { Test-Path "$_\bash.exe" } | Select-Object -First 1
          if (-not $git) { Write-Output "::error::Git for Windows introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $git
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $docker = "$env:ProgramFiles\Docker\Docker\resources\bin"
            if (-not (Test-Path "$docker\docker.exe")) { Write-Output "::error::docker.exe introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $docker
          }

      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      # Sans jeton dans .git/config : le dépôt est copié tel quel dans le
      # conteneur, où tournent l'installation et la compilation (code des
      # dépendances compris), et ce jeton peut écrire dans le dépôt et ses
      # releases. Rien n'en a besoin : `gh` reçoit le sien à l'étape Publier,
      # les attestations prennent le leur.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false

      - name: Contrôler l'étiquette
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Étiquette invalide : $VERSION (attendu : v1.2.3 ou v1.2.3-rc.1)"; exit 1; }
          git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null \
            || { echo "::error::L'étiquette $VERSION n'existe pas."; exit 1; }

      # Node et pnpm à l'intérieur, aux versions du dépôt : l'interface est
      # compilée par la version de Node qui l'exécutera sur les serveurs.
      - name: Conteneur Linux
        run: bash infra/ci/linux.sh ouvrir

      - name: Installer les dépendances
        run: bash infra/ci/linux.sh lancer 'pnpm install --frozen-lockfile'

      # Compilation complète, en production. Aucun secret : les clés ne sont
      # lues qu'à l'exécution, sur le serveur.
      - name: Compiler
        run: bash infra/ci/linux.sh lancer 'pnpm build'

      - name: Assembler l'archive
        run: bash infra/ci/linux.sh lancer 'bash infra/release/assembler.sh "$VERSION" dist'

      # L'archive autonome : le panel prêt à tourner, qu'un hébergement cPanel
      # installe sans outils puis met à jour de lui-même depuis cette page
      # (docs/hebergement-cpanel.md). L'interface y est construite à part
      # (`.next-autonome`), après l'archive ordinaire, qui n'en est pas
      # touchée. Attestée et publiée avec le reste : les motifs des étapes
      # suivantes la couvrent.
      - name: Assembler l'archive autonome
        run: |
          bash infra/ci/linux.sh lancer '
            GAMEDASHBOARD_AUTONOME=1 pnpm --filter @gamedashboard/web build
            node infra/release/autonome.mjs "$VERSION" dist'

      # Inventaire des dépendances livrées (PLAN §5.4), au format CycloneDX,
      # publié à côté de l'archive. Trivy lit le lockfile, sans les
      # dépendances de développement, qui ne sont pas livrées, et prend les
      # licences dans node_modules : c'est pour cela qu'il n'est pas exclu.
      # Même image épinglée que l'audit de la CI : aucun outil de plus.
      - name: Inventaire des dépendances (SBOM)
        run: |
          source infra/ci/outils.env
          bash infra/ci/linux.sh outil "$IMAGE_TRIVY" fs --format cyclonedx \
            --output "dist/gamedashboard-$VERSION.cdx.json" \
            --skip-dirs dist --skip-dirs apps/web/.next /w

      - name: Rapatrier l'archive
        run: bash infra/ci/linux.sh rapatrier dist

      - name: Attester la provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/gamedashboard-*.tar.gz
            dist/gamedashboard.sh
            dist/installer-wings.sh

      # L'inventaire est signé et rattaché à l'archive : `gh attestation
      # verify` prouve qu'il décrit bien celle-ci, et qu'il sort de ce workflow.
      - name: Attester l'inventaire
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/gamedashboard-*.tar.gz
          sbom-path: dist/gamedashboard-${{ env.VERSION }}.cdx.json

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE="gamedashboard-$VERSION"
          cat > notes.md <<EOF
          ## Installer

          Sur une Debian 12/13 ou Ubuntu 22.04/24.04 neuve, une seule commande :

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/gamedashboard.sh | sudo bash -s -- install
          \`\`\`

          Ensuite : \`gamedashboard help\` (\`status\`, \`backup\`, \`update\`…).

          À la main, avec Node.js 24 et \`corepack enable\` :

          \`\`\`bash
          sha256sum -c $ARCHIVE.tar.gz.sha256      # l'archive est intacte
          tar -xzf $ARCHIVE.tar.gz && cd $ARCHIVE
          pnpm app:install
          pnpm app:setup
          pnpm app:start
          \`\`\`

          Le guide pas à pas : [docs/installation.md](https://github.com/${{ github.repository }}/blob/$VERSION/docs/installation.md).
          Machine de jeu : \`curl -fsSL …/gamedashboard.sh | sudo bash -s -- wings\`.

          Mettre à jour une installation : \`gamedashboard update\` (sauvegarde d'abord, puis applique cette version).
          Comptes, secrets et base sont conservés.

          Hébergement cPanel (sans terminal) : \`$ARCHIVE-autonome.tar.gz\`, à extraire dans le dossier personnel.
          Le panel s'y met ensuite à jour de lui-même depuis cette page
          ([guide](https://github.com/${{ github.repository }}/blob/$VERSION/docs/hebergement-cpanel.md)).

          ## Vérifier

          \`$ARCHIVE.cdx.json\` est l'inventaire des dépendances livrées (CycloneDX).
          L'archive et son inventaire sont attestés par ce workflow :

          \`\`\`bash
          gh attestation verify $ARCHIVE.tar.gz --repo ${{ github.repository }}
          gh attestation verify $ARCHIVE.tar.gz --repo ${{ github.repository }} --predicate-type https://cyclonedx.org/bom
          \`\`\`
          EOF

          PRE=()
          [[ "$VERSION" == *-* ]] && PRE=(--prerelease)

          # Rejouable : une release déjà créée voit ses fichiers remplacés.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "GameDashboard $VERSION" \
              --notes-file notes.md --generate-notes --verify-tag "${PRE[@]}"
          fi

      # Prévient l'hébergement autonome qu'une version vient de paraître : il
      # la vérifie aussitôt, au lieu d'attendre sa vérification suivante (une
      # demi-heure au plus). Facultatif : sans la variable PANEL_URL et le
      # secret PANEL_SIGNAL_SECRET (le même que GAMEDASHBOARD_SIGNAL_SECRET
      # dans son api.env), rien ne part. Une préversion n'est jamais
      # installée par un hébergement : pas de signal non plus.
      - name: Prévenir l'hébergement autonome
        if: ${{ vars.PANEL_URL != '' }}
        continue-on-error: true
        env:
          PANEL_URL: ${{ vars.PANEL_URL }}
          SECRET: ${{ secrets.PANEL_SIGNAL_SECRET }}
        run: |
          [[ "$VERSION" == *-* ]] && { echo "Préversion : pas de signal."; exit 0; }
          [ -n "$SECRET" ] || { echo "PANEL_SIGNAL_SECRET absent : pas de signal."; exit 0; }
          HORODATAGE=$(date +%s)
          SIGNATURE=$(printf '%s.%s' "$HORODATAGE" "$VERSION" \
            | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.*= //')
          curl -fsS -X POST "$PANEL_URL/api/v1/updates/signal" \
            -H "x-gamedashboard-timestamp: $HORODATAGE" \
            -H "x-gamedashboard-version: $VERSION" \
            -H "x-gamedashboard-signature: sha256=$SIGNATURE" \
            -o /dev/null -w "Signal : %{http_code}\n"

      # La release est déjà publiée à ce stade : un quota d'artefacts atteint
      # ne doit pas la faire paraître en échec.
      - name: Conserver l'archive
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gamedashboard-${{ env.VERSION }}
          path: dist/
          retention-days: 14

      - name: Rendre la machine du runner
        if: always()
        run: bash infra/ci/linux.sh fermer

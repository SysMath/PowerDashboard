name: Captures de référence

# Prend les captures de référence de la suite visuelle (apps/web/e2e/visuel.spec.ts)
# sur le runner, et les commite sur la branche choisie.
#
# Sur le runner et nulle part ailleurs : le rendu des polices change d'une
# machine à l'autre, et une référence prise ailleurs ferait échouer la CI sur
# des différences d'anticrénelage que personne n'a introduites.
#
# À lancer à la main (onglet Actions › Captures de référence › Run workflow) :
# - une fois, pour créer les références ;
# - ensuite, après un changement d'interface **voulu** que la CI signale.
#
# Le commit est poussé avec le jeton du workflow, qui ne relance pas la CI :
# pousser ensuite n'importe quel commit, ou relancer la CI, pour la voir
# comparer contre les nouvelles références.

on:
  workflow_dispatch:
    inputs:
      # Le même que celui de la CI : le conteneur est le même partout, mais
      # un autre processeur peut décaler l'anticrénelage d'un pixel.
      runner:
        description: "Runner : celui de la variable CI_RUNNER, ceux de GitHub, ou l'auto-hébergé"
        type: choice
        options: [CI_RUNNER, ubuntu-latest, self-hosted]
        default: CI_RUNNER

concurrency:
  group: captures-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Comme la CI : bash sur le runner (Git Bash sous Windows), commandes dans un
# conteneur Linux (infra/ci/linux.sh), le même que celui des parcours : les captures
# prises ici sont celles que la CI comparera.
defaults:
  run:
    shell: bash

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  captures:
    name: Prendre et commiter les captures
    runs-on: ${{ fromJSON(inputs.runner && inputs.runner != 'CI_RUNNER' && toJSON(inputs.runner) || vars.CI_RUNNER || '"self-hosted"') }}
    timeout-minutes: 30
    permissions:
      # Pousser le commit des captures sur la branche choisie.
      contents: write

    # Même base que le job e2e de la CI (infra/ci/linux.sh ouvrir --postgres) :
    # les écrans capturés sont ceux que la CI comparera ensuite.
    env:
      APP_SECRET_KEY: cle-de-test-ci-0123456789abcdef0123456789abcdef
      E2E_EMAIL: e2e@gamedashboard.test
      E2E_PASSWORD: Essai-E2E-2026!motdepasse

    steps:
      # Le service du runner ne voit pas toujours le PATH de la session : on
      # pose ici, devant tout le reste (y compris le bash de WSL), le bash de
      # Git for Windows et docker.exe, qu'exigent toutes les étapes suivantes.
      # La stratégie d'exécution de Windows refuse les scripts par défaut :
      # levée pour ce seul processus.
      - name: Bash de Git et Docker
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $git = @("$env:ProgramFiles\Git\bin", "${env:ProgramFiles(x86)}\Git\bin", "$env:LOCALAPPDATA\Programs\Git\bin") |
            Where-Object { Test-Path "$_\bash.exe" } | Select-Object -First 1
          if (-not $git) { Write-Output "::error::Git for Windows introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $git
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $docker = "$env:ProgramFiles\Docker\Docker\resources\bin"
            if (-not (Test-Path "$docker\docker.exe")) { Write-Output "::error::docker.exe introuvable sur le runner (docs/runner-auto-heberge.md)."; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $docker
          }

      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      # Sans jeton dans .git/config : le dépôt est copié tel quel dans le
      # conteneur, où tournent l'installation, la compilation et Playwright,
      # et ce jeton peut pousser. Seule l'étape du commit, sur le runner, le
      # reçoit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Conteneur Linux et base
        run: bash infra/ci/linux.sh ouvrir --postgres

      - name: Installer les dépendances
        run: bash infra/ci/linux.sh lancer 'pnpm install --frozen-lockfile'

      - name: Installer le navigateur
        run: bash infra/ci/linux.sh lancer 'pnpm --filter @gamedashboard/web exec playwright install --with-deps chromium'

      - name: Migrations
        run: bash infra/ci/linux.sh lancer 'pnpm --filter @gamedashboard/db db:migrate'

      - name: Compte d'essai
        run: |
          bash infra/ci/linux.sh lancer '
            pnpm --filter @gamedashboard/api exec tsx scripts/create-admin.mts "$E2E_EMAIL" Essai CI
            GD_PASSWORD="$E2E_PASSWORD" \
              pnpm --filter @gamedashboard/api exec tsx scripts/reset-password.mts "$E2E_EMAIL"'

      # Comme dans ci.yml : la seconde preuve du personnel, exigée par défaut,
      # est levée pour cette base jetable seule, sans quoi chaque capture de
      # l'administration montrerait « seconde preuve exigée ».
      - name: Seconde preuve du personnel levée pour la base d'essai
        run: |
          bash infra/ci/linux.sh psql \
            "insert into settings (key, value) values ('security.staffRequires2fa', 'false'::jsonb)
             on conflict (key) do update set value = excluded.value"

      - name: Construire
        run: bash infra/ci/linux.sh lancer 'pnpm build'

      # Toutes les références sont reprises, pas seulement celles qui manquent :
      # c'est le geste qui entérine un changement d'interface voulu.
      - name: Prendre les captures
        run: bash infra/ci/linux.sh lancer 'pnpm --filter @gamedashboard/web exec playwright test e2e/visuel.spec.ts --update-snapshots=all'

      - name: Rapatrier les captures
        run: bash infra/ci/linux.sh rapatrier apps/web/e2e/visuel.spec.ts-snapshots

      # Le contexte `github` passe par l'environnement, jamais interpolé dans
      # le script : un nom de branche est choisi par qui la pousse.
      # Le jeton n'est donné qu'à cette étape, sur le runner, et à ce seul
      # `git push` (variables GIT_CONFIG_*, lues par cette commande seule) : en
      # en-tête, comme le fait actions/checkout, jamais écrit dans .git/config
      # ni dans l'adresse du dépôt.
      - name: Commiter les captures
        env:
          EXECUTION: ${{ github.run_id }}
          BRANCHE: ${{ github.ref_name }}
          JETON: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visuel.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Captures identiques aux références : rien à commiter."
            exit 0
          fi
          git commit -m "Captures de référence, prises sur le runner" -m "Workflow « Captures de référence », exécution $EXECUTION."
          AUTORISATION=$(printf 'x-access-token:%s' "$JETON" | base64 | tr -d '\n')
          echo "::add-mask::$AUTORISATION"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTORISATION" \
            git push origin "HEAD:$BRANCHE"

      - name: Rendre la machine du runner
        if: always()
        run: bash infra/ci/linux.sh fermer

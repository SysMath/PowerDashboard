packages:
  - "apps/*"
  - "packages/*"

# Scripts d'installation autorisés, un par un. pnpm les bloque par défaut : un
# « postinstall » s'exécute avec les droits de l'utilisateur dès l'installation,
# avant même que la moindre ligne du projet ne tourne. C'est la voie d'entrée
# classique d'une compromission de chaîne d'approvisionnement.
#
# Toute ligne ajoutée ici est une exception motivée, jamais un réflexe pour
# faire taire un avertissement.
allowBuilds:
  # Amené par drizzle-kit. Son script résout le binaire natif correspondant à
  # la plateforme ; sans lui, drizzle-kit ne démarre pas.
  esbuild: true

  # Amenés tous deux par next-intl : compilation des messages et surveillance
  # des catalogues en développement. Modules natifs, dont le script
  # d'installation met en place le binaire de la plateforme.
  '@swc/core': true
  '@parcel/watcher': true

# Versions imposées à tout l'arbre de dépendances.
# pnpm 11 ne lit plus le champ « pnpm » de package.json : les overrides vivent ici.
overrides:
  # drizzle-kit passe encore par @esbuild-kit/esm-loader, déprécié, qui épingle
  # un esbuild dont le serveur de développement accepte les requêtes de
  # n'importe quel site (GHSA-67mh-4wv8-2f99). Uniquement exploitable en
  # développement, mais la correction ne coûte rien.
  esbuild: ">=0.25.0"

  # Types de Node alignés sur la majeure du moteur (Node 24, .nvmrc) dans tout
  # l'arbre : sans cela, les pairs installés d'office (vite, vitest, Storybook)
  # tirent la dernière majeure publiée et décrivent des API absentes de Node 24.
  "@types/node": "^24.13.6"

  # monaco-editor 0.57.0, sa dernière version, épingle dompurify à 3.4.15
  # exactement (GHSA-p98j-92pf-mc4p, corrigé en 3.4.16) : le lockfile seul ne
  # peut pas monter au-dessus d'une version exacte. À retirer quand
  # monaco-editor publiera une version qui tire 3.4.16 ou plus.
  "monaco-editor>dompurify": "^3.4.16"

  # xcode (amené par les greffons de configuration d'Expo, qui écrivent le
  # projet iOS au `prebuild`) tire uuid 7, sans contrôle de taille du tampon
  # en v3/v5/v6 (GHSA-w5hq-g745-h8pq). xcode n'appelle que `uuid.v4()`, que
  # la 11 garde à l'identique en CommonJS. Outil de construction seulement.
  "xcode>uuid": "^11.1.1"

# Aucune dépendance transitive tirée d'une source hors du registre (dépôt git,
# archive par URL) : seule une dépendance directe, écrite ici, peut le faire.
blockExoticSubdeps: true

# Refuse une version publiée avec moins de garanties que la précédente (perte
# de la provenance ou de la publication de confiance) : c'est la trace d'un
# compte de mainteneur repris.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Correctif de sécurité (CVE-2022-25883) rétroporté sur la branche 6 en
  # juillet 2023, publié à la main sans la provenance des 7.x : faux positif
  # connu. Amené par @babel/core (Storybook, styled-jsx de Next).
  - semver@6.3.1

  # Publiée en janvier 2025 par le même mainteneur que la 3.2.1 (jkoops), à la
  # main, sans la provenance de la 3.2.1 : faux positif relu. L'écart entre les
  # deux se borne à index.js (WeakRef sur les ressources suivies, piles
  # recopiées avant affichage), aucun script d'installation, aucune dépendance
  # ajoutée. Amené par vitest 5.0.2 (outil de diagnostic des tests seulement).
  - why-is-node-running@3.2.2

# Avis connus, sans correctif publiable dans l'arbre, et relus un par un.
auditConfig:
  ignoreGhsas:
    # node-forge : vérification des signatures RSA PKCS#1 v1.5 trop permissive.
    # Aucune version corrigée publiée. Amené par @expo/cli seul (certificats de
    # signature des mises à jour à chaud, que l'application n'emploie pas :
    # ADR 0010, aucune mise à jour hors des magasins). Jamais embarqué dans
    # l'application ni dans le panel.
    - GHSA-86w9-cpqp-85rv
    # decode-uri-component 0.2 : décodage exponentiel d'une adresse mal formée.
    # Amené par query-string 7 (expo-router, lecture des liens de
    # l'application). La 0.5 corrigée n'est plus qu'en module ES, que
    # query-string 7 ne sait pas charger. Seul le téléphone qui ouvre un lien
    # piégé en pâtirait, et un lien de l'application n'est lu que s'il porte
    # le schéma `gamedashboard://`.
    - GHSA-vcc3-ghjq-m6fr
    # braces <= 3.0.3 : déni de service par motifs d'accolades imbriqués
    # (sévérité haute). Aucune version corrigée publiée. Amené par l'outillage
    # de build de apps/mobile seul : expo > @expo/cli > metro-file-map >
    # micromatch > braces 3.0.3, qui lit les motifs de fichiers du dépôt à la
    # compilation, sur la machine de build. Jamais embarqué dans l'application
    # ni dans le panel, et aucun motif venu d'un tiers ne lui est donné.
    # Décision de Matheol : avis ignoré.
    - GHSA-vfj7-8cjw-p6xm

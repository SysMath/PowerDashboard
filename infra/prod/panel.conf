# GameDashboard — vhost nginx de production.
#
# `panel.example.fr` est un nom d'exemple : deploy.sh le remplace par le
# domaine réel en installant ce fichier. Ne pas l'éditer à la main.
#
# Deux processus derrière un seul nom : l'interface Next (:3210) sert tout,
# l'API Nest (:3211) n'est jointe que sur les préfixes qui doivent l'être
# depuis l'extérieur. Ce n'est pas une optimisation, c'est la règle
# d'exposition : le reste de l'API — administration, revendeurs, espace client —
# n'est appelé que par l'interface, depuis la machine, sur la boucle locale.
# Seule exception : l'espace client, pour le jeton d'un appareil mobile lié
# (ADR 0010, plus bas).

# Limitation par adresse, en amont de l'application.
#
# Quatre zones, parce que quatre rythmes légitimes : une intégration tierce
# appelle l'API applicative en rafale, un daemon rafale aussi à son démarrage,
# une supervision relit le statut toutes les minutes, et personne ne se
# connecte dix fois par seconde. Le compteur applicatif (verrou par compte et
# par adresse) reste la protection de fond ; celle-ci évite seulement que
# l'API paie chaque tentative.
limit_req_zone $binary_remote_addr zone=gd_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=gd_app:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=gd_remote:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gd_status:10m rate=1r/s;

# Le code de refus est posé **dans le serveur**, pas ici.
#
# `limit_req_status` ne s'admet qu'une fois par contexte : si un autre vhost
# de la machine le déclare déjà au niveau `http`, les deux fichiers sont
# inclus dans le même bloc et nginx refuse de démarrer. C'est arrivé. Les
# zones, elles, doivent rester ici : elles ne sont déclarables qu'au niveau
# `http`.
#
# Règle qui en découle : tout ce que ce fichier ajoute doit tenir dans son
# propre périmètre.

# Relais du WebSocket de la console. La première version s'appuyait sur un
# `$req_connection` déclaré ailleurs sur la machine partagée : sur une machine
# neuve, nginx refusait de démarrer sur une variable inconnue. Le nom est
# préfixé pour ne pas entrer en collision avec un `map` d'un autre vhost —
# nginx refuse aussi une variable déclarée deux fois.
#
# Seul `websocket` est relayé comme mise à niveau : relayer n'importe quel
# `Upgrade` ouvrirait la contrebande h2c (une connexion HTTP/2 en clair vers
# l'amont, hors des contrôles de ce vhost).
map $http_upgrade $gd_upgrade {
    ~*^websocket$ websocket;
    default       "";
}

map $http_upgrade $gd_connection {
    ~*^websocket$ upgrade;
    default       close;
}

# Application mobile (ADR 0010) : l'espace client de l'API n'est joint de
# l'extérieur qu'avec le jeton d'un appareil lié (`gd_mob_…`). Toute autre
# requête sur ces chemins continue vers l'interface, qui n'y sert rien : une
# clé personnelle ou un cookie n'ouvrent pas cette porte.
map $http_authorization $gd_mobile_upstream {
    "~^Bearer gd_mob_" 127.0.0.1:3211;
    default            127.0.0.1:3210;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.fr;

    # Ni la redirection ni une page d'erreur de nginx ne disent sa version.
    # Posé dans chaque serveur et non au niveau `http` : un `server_tokens`
    # déjà présent dans nginx.conf y ferait refuser la configuration pour
    # doublon (même règle que `limit_req_status`, plus haut).
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.fr;

    # Voir plus haut : ce code vit dans le serveur pour ne pas entrer en
    # conflit avec un autre vhost éventuel.
    limit_req_status 429;
    server_tokens off;

    # Certificat du domaine, émis et renouvelé par certbot hors de ce fichier :
    # redéployer n'en émet pas, donc ne rapproche pas de la limite de Let's
    # Encrypt. Chemin à adapter (un certificat générique convient aussi).
    ssl_certificate     /etc/letsencrypt/live/panel.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.fr/privkey.pem;
    # Livré par ce dépôt (`tls-intermediate.conf`) et posé par deploy.sh s'il
    # manque : il existait sur la machine partagée, pas sur une machine neuve.
    include snippets/tls/tls-intermediate.conf;
    # Pas d'agrafage OCSP (`ssl_stapling`), et ce n'est pas un oubli : Let's
    # Encrypt n'inscrit plus d'adresse OCSP dans ses certificats depuis
    # mai 2025 et a éteint ses répondeurs en août 2025 — la révocation passe
    # par des CRL que le navigateur consulte lui-même. La directive n'y
    # produirait qu'un avertissement au démarrage (« no OCSP responder URL »).
    # Avec le certificat d'une autorité qui publie encore OCSP, on l'ajouterait
    # ici avec `ssl_stapling_verify on;` et un `resolver`.

    charset utf-8;
    # Les envois de fichiers vers un serveur de jeu ne passent **pas** par ici :
    # le navigateur les adresse directement au daemon, avec un jeton signé.
    # Ce qui transite par le rendu — formulaires, JSON d'egg collé — tient
    # dans quelques mégaoctets ; au-delà, ce serait un moyen d'occuper la
    # mémoire du rendu.
    client_max_body_size 16M;

    access_log /var/log/nginx/panel.example.fr.access.log;
    error_log  /var/log/nginx/panel.example.fr.error.log;

    # Le panel est entièrement authentifié : il n'a rien à offrir à un moteur
    # de recherche, et ses écrans de connexion n'ont pas à y figurer.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS se pose ici et non dans l'application : c'est nginx qui termine TLS.
    #
    # Un an, `includeSubDomains` compris : sans lui, un sous-domaine resté en
    # HTTP pouvait servir en clair une page sous le nom du panel et y poser un
    # cookie. La directive ne vaut que pour ce nom **et ce qui est dessous**
    # (`*.panel.example.fr`), jamais pour ses voisins (`www.example.fr`) :
    # seul un panel installé sur le domaine nu mettrait tous les sous-domaines
    # de la zone en HTTPS obligatoire — à vérifier avant, dans ce cas-là. Les
    # domaines des revendeurs ont leurs propres blocs (certificates.sh).
    #
    # Sans `preload` : l'inscription dans la liste des navigateurs est un
    # engagement pour tout le domaine, qui ne se défait pas en redéployant —
    # en sortir prend des mois, pendant lesquels un sous-domaine en HTTP reste
    # injoignable. C'est une décision d'exploitation, pas un réglage du panel.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------
    # API applicative — le seul préfixe d'API ouvert au monde.
    #
    # C'est par là que le système de facturation tiers crée les comptes et les
    # serveurs. Il s'authentifie par clé applicative à portées ; le reste de
    # l'API n'a aucune raison d'être joignable d'ailleurs que de la machine.
    # ------------------------------------------------------------------
    location /api/v1/application/ {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Contrat Wings.
    #
    # Les daemons appellent le panel depuis leurs propres machines, avec le
    # jeton du node. Wings étant inchangé, ces chemins sont imposés : ils ne
    # peuvent pas être déplacés sous un autre préfixe.
    # ------------------------------------------------------------------
    location /api/remote/ {
        # Par adresse de node. Large, parce qu'un daemon rafale légitimement :
        # à son démarrage, l'inventaire paginé en parallèle ; ensuite, une
        # configuration relue par serveur démarré, des authentifications SFTP,
        # le journal d'activité par lots. Plusieurs nodes derrière une même
        # adresse partagent la rafale.
        limit_req zone=gd_remote burst=300 nodelay;
        # 503 ici, et non le 429 du serveur : Wings abandonne sur tout 4xx et
        # ne rejoue que les 5xx, avec temporisation. Un compte rendu de
        # sauvegarde refusé en 429 lui ferait effacer l'archive ; en 503, il
        # repasse quelques secondes plus tard.
        limit_req_status 503;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un transfert de serveur entre nodes tient la requête longtemps.
        proxy_read_timeout 600s;
    }

    # Agent de node facultatif (ADR 0008, 0009) : même rôle que Wings, appelé
    # depuis la machine avec son propre jeton, jamais par un navigateur. Même
    # zone que le daemon, et 503 pour que l'agent repasse au relevé suivant.
    location /api/node-agent/ {
        limit_req zone=gd_remote burst=60 nodelay;
        limit_req_status 503;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Application mobile (ADR 0010).
    #
    # La liaison (`auth/app/`) s'authentifie par ce qu'elle porte : code et
    # PKCE, ou secret d'appareil, toujours signés par la clé du téléphone.
    # L'espace client et le profil ne vont à l'API qu'avec le jeton d'un
    # appareil (`$gd_mobile_upstream`). Aucun cookie ne passe : ces routes ne
    # deviennent jamais des routes de session. Zone `gd_app` et non
    # `gd_auth` : les téléphones d'un même opérateur partagent souvent une
    # adresse, et rien ici ne se devine par force brute.
    # ------------------------------------------------------------------
    location /api/v1/auth/app/ {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            "";
    }

    # ------------------------------------------------------------------
    # Relais de notifications de l'éditeur (ADR 0010) : ne répond que sur
    # l'instance qui porte `PUSH_RELAY=1`, 404 ailleurs. Public, sans
    # cookie : les panels s'y enregistrent et y envoient (signé), les
    # téléphones y inscrivent leur jeton. Zone `gd_app`.
    # ------------------------------------------------------------------
    location /api/v1/relais/ {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            "";
    }

    location /api/v1/client/ {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://$gd_mobile_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- destination tirée du map plus haut, deux adresses locales fixes (API ou interface), jamais de la requête
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            "";
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/me {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://$gd_mobile_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- destination tirée du map plus haut, deux adresses locales fixes (API ou interface), jamais de la requête
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            "";
    }

    # Mise en service d'un daemon : `wings configure` vient y chercher la
    # configuration du node. Le chemin n'a pas de « v1 » et ce n'est pas un
    # oubli — il est codé en dur dans Wings, au même titre que /api/remote.
    #
    # Deux routes y répondent, `configuration` (`wings configure`) et
    # `agent-configuration` (`gamedashboard-agent configure`). Toutes deux
    # exigent la portée `nodes.configure` : leur réponse contient un jeton.
    location /api/application/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Spécification OpenAPI : publique, pour qu'un intégrateur génère son
    # client sans ouvrir de compte. Même zone de limitation que le statut —
    # elle est lue par des outils, qui savent boucler.
    location = /api/v1/openapi.json {
        limit_req zone=gd_status burst=10 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statut public : lisible sans compte, par construction. L'exposer
    # directement permet à une supervision tierce de l'interroger sans rendre
    # une page entière.
    location = /api/v1/status {
        limit_req zone=gd_status burst=10 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Écrans d'authentification : mêmes réglages que l'interface, plus une
    # limite par adresse. Les envois de formulaire (actions serveur de Next)
    # partent sur l'URL de la page, c'est donc ici qu'ils se comptent. La
    # rafale laisse passer un chargement de page et ses ressources.
    location ~ ^/(login|register|forgot-password|reset|verify)$ {
        limit_req zone=gd_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry      "";
    }

    # Lien de connexion de la facturation : `/sso/<jeton>`. Le jeton est dans
    # le chemin et vaut une session pendant deux minutes ; écrit dans le
    # journal d'accès, il se lirait par quiconque lit les journaux. Écran
    # d'authentification : même limite que les autres, le second facteur s'y
    # saisit.
    location ~ ^/sso/ {
        access_log off;
        limit_req zone=gd_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry      "";
    }

    # ------------------------------------------------------------------
    # Interface.
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade limité à websocket (map plus haut), la parade que la règle demande
        # La console d'un serveur de jeu est un WebSocket relayé par un route
        # handler de Next. Sans ces deux en-têtes, la console reste muette
        # sans qu'aucune erreur ne s'affiche.
        proxy_set_header Upgrade    $gd_upgrade;
        proxy_set_header Connection $gd_connection;
        proxy_set_header Host              $server_name;
        # Réécrit, jamais relayé : le rendu en tire le domaine des liens de
        # réinitialisation, et un client pourrait sinon y placer le sien.
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vidé, jamais relayé : le pays figure dans l'alerte « nouvelle
        # connexion », et sans frontal Cloudflare c'est le visiteur qui
        # l'écrirait. Derrière Cloudflare, remplacer "" par $http_cf_ipcountry
        # (et n'ouvrir le port 443 qu'aux plages de Cloudflare).
        proxy_set_header CF-IPCountry      "";
        # Une console ouverte ne parle pas forcément toutes les minutes.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# GameDashboard — production locale, sur Codiax (WSL).
#
# Même découpage qu'en production : l'interface Next (:3210) sert tout, l'API
# Nest (:3211) n'est jointe que sur les préfixes qui doivent l'être depuis
# l'extérieur. La règle d'exposition ne change pas parce que la machine est
# locale — c'est précisément ce qu'on veut répéter ici.
#
# TLS par mkcert, dont l'autorité est déjà celle de `powervideo.local` sur
# cette machine. Le certificat couvre aussi `*.gamedashboard.local` : les
# domaines de revendeurs se testent donc sans en émettre un second.
#
# **Une seule origine canonique.** `PANEL_ORIGIN` sert de référence au contrôle
# d'origine des WebSockets, à CORS et à l'identifiant de partie vérifiante des
# clés d'accès. Deux noms vivants donneraient des échecs discrets sur l'un des
# deux — console muette, clé d'accès refusée — sans message clair. Tout ce qui
# arrive par un autre nom est donc **redirigé**, pas servi.

# Relais du WebSocket de la console. Le vhost public s'appuie sur un `map`
# déclaré ailleurs sur la machine partagée ; ici rien ne le déclare, et nginx
# refuserait de démarrer sur une variable inconnue.
# Seul `websocket` est relayé comme mise à niveau (contrebande h2c, voir
# infra/prod/panel.conf).
map $http_upgrade $gd_local_upgrade {
    ~*^websocket$ websocket;
    default       "";
}

map $http_upgrade $req_connection {
    ~*^websocket$ upgrade;
    default       close;
}

# Limitation par adresse, **les mêmes zones que le modèle** `infra/prod/panel.conf`
# (voir ses commentaires pour le choix des débits). La production locale est
# la seule installation réelle : sans elles, les limites du modèle ne
# protégeaient que des installations à venir. Les zones ne se déclarent qu'au
# niveau `http`, d'où leur place ici ; leurs noms, préfixés, n'entrent pas en
# collision avec les sites voisins de la machine.
limit_req_zone $binary_remote_addr zone=gd_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=gd_app:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=gd_remote:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gd_status:10m rate=1r/s;

# --- Tout le reste vient ici, puis repart vers le nom canonique -------------
server {
    listen 80;
    listen [::]:80;
    server_name gamedashboard.local *.gamedashboard.local gamedashboard.localhost localhost;
    server_tokens off;

    # 301 et non 302 : le nom canonique ne changera pas, et le navigateur peut
    # retenir. `gamedashboard.localhost` reste donc un raccourci valable.
    return 301 https://gamedashboard.local$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gamedashboard.local;

    # Dans le serveur et non au niveau `http` : `limit_req_status` ne s'admet
    # qu'une fois par contexte, et un site voisin de la machine peut le poser.
    limit_req_status 429;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/gamedashboard.local.pem;
    ssl_certificate_key /etc/nginx/certs/gamedashboard.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    charset utf-8;
    client_max_body_size 16M;

    access_log /var/log/nginx/gamedashboard.local.access.log;
    error_log  /var/log/nginx/gamedashboard.local.error.log;

    # Pas de HSTS, délibérément : il enfermerait le navigateur sur un nom servi
    # par un certificat de développement, et la moindre réinstallation de
    # l'autorité mkcert rendrait le panel inaccessible sans échappatoire.

    # --- API applicative : la porte de la facturation tierce ---------------
    location /api/v1/application/ {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Contrat Wings : chemins imposés par le daemon, non déplaçables ----
    location /api/remote/ {
        # Large, pour le démarrage d'un node chargé ; et en 503, que Wings
        # rejoue, jamais en 429, qu'il abandonne (voir panel.conf).
        limit_req zone=gd_remote burst=300 nodelay;
        limit_req_status 503;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Agent de node facultatif (ADR 0008, 0009) : même rôle que Wings, appelé
    # depuis la machine avec son propre jeton, jamais par un navigateur. Même
    # zone que le daemon, et 503 pour que l'agent repasse au relevé suivant.
    location /api/node-agent/ {
        limit_req zone=gd_remote burst=60 nodelay;
        limit_req_status 503;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/application/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Spécification OpenAPI, publique -----------------------------------
    # Exposée pour qu'un intégrateur génère son client sans avoir à ouvrir un
    # compte. Elle ne décrit que des chemins et le nom de l'authentification
    # exigée : rien que l'écran « API » du panel ne montre déjà.
    location = /api/v1/openapi.json {
        limit_req zone=gd_status burst=10 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Statut public, lisible sans compte --------------------------------
    location = /api/v1/status {
        limit_req zone=gd_status burst=10 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Écrans d'authentification : l'interface, plus une limite ----------
    # Les envois de formulaire (actions serveur de Next) partent sur l'URL de
    # la page : c'est ici qu'ils se comptent.
    location ~ ^/(login|register|forgot-password|reset|verify)$ {
        limit_req zone=gd_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Lien de connexion de la facturation : `/sso/<jeton>` ---------------
    # Le jeton est dans le chemin et vaut une session pendant deux minutes :
    # il n'a rien à faire dans le journal d'accès. Écran d'authentification :
    # même limite que les autres, le second facteur s'y saisit.
    location ~ ^/sso/ {
        access_log off;
        limit_req zone=gd_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $server_name;
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Interface ----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade limité à websocket (map plus haut), la parade que la règle demande
        # Sans ces deux en-têtes, la console d'un serveur reste muette sans
        # qu'aucune erreur ne s'affiche.
        proxy_set_header Upgrade    $gd_local_upgrade;
        proxy_set_header Connection $req_connection;
        proxy_set_header Host              $server_name;
        # Réécrit, jamais relayé : le rendu en tire le domaine des liens.
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
